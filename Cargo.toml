[package]
name = "badges-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "🏷️ A highly customizable badge component for WASM frameworks like Yew, Dioxus, and Leptos."
license = "MIT"
keywords = ["badge", "yew", "dioxus", "leptos", "badges-rs"]
categories = ["web-programming", "science"]
repository = "https://github.com/opensass/badges-rs"
documentation = "https://docs.rs/badges-rs"
authors = ["Mahmoud Harmouch <oss@wiseai.dev>"]
exclude = [
    "/assets",
    "/examples",
    ".*"
]

[dependencies]
yew = { version = "0.23.0", default-features = false, optional = true }
dioxus = { version = "0.7.10", optional = true }
leptos = { version = "0.8.20", optional = true }
dioxus-logger = { version = "0.7.10", optional = true }

[features]
yew = ["dep:yew"]
dio = ["dioxus", "dioxus-logger"]
lep = ["leptos"]

[profile.release]
opt-level = "z"
debug = false
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[badges]
maintenance = { status = "actively-developed" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
bump2version = "0.2.2"
